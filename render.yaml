services:
  - type: web
    name: bizlens
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: GROQ_API_KEY
        sync: false          # you paste it in the Render dashboard; it is never in git
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
