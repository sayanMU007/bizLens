services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bizlens}
      POSTGRES_USER: ${POSTGRES_USER:-bizlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizlens_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizlens} -d ${POSTGRES_DB:-bizlens}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env            # GROQ_API_KEY lives here and reaches ONLY this service
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      POSTGRES_HOST: db       # overrides the localhost value from .env
      DATA_DIR: /app/data     # uploaded files + Parquet live on the named volume below
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - datafiles:/app/data

  frontend:
    build: ./frontend
    environment:              # explicit allowlist: no env_file, so no secrets leak in
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
  datafiles:
